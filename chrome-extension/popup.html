<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>StreamSafe</title>
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; color: #1d1d24; background: #fff; }
    h1 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
    label { display: block; margin: 8px 0 2px; font-weight: 600; font-size: 12px; color: #555; }
    input[type=password], input[type=number], select { width: 100%; box-sizing: border-box; padding: 5px 6px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    .stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin-top: 12px; padding: 8px; background: #f4f4f7; border-radius: 8px; }
    .stats b { text-align: right; }
    .stats .jev { color: #6441a5; font-weight: 700; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 6px; border: 0; border-radius: 6px; background: #6441a5; color: #fff; font: 600 12px system-ui; cursor: pointer; }
    button.secondary { background: #e4e4ea; color: #333; }
    #saved { color: #2e7d32; font-size: 12px; height: 16px; margin-top: 4px; }
    #lastError { color: #b3261e; font-size: 11px; margin-top: 8px; word-break: break-word; }
  </style>
</head>
<body>
  <h1>🛡 StreamSafe <label style="margin:0;font-size:13px;color:#1d1d24"><input type="checkbox" id="enabled"> on</label></h1>

  <label for="deepgramKey">Deepgram key</label>
  <input type="password" id="deepgramKey" autocomplete="off">
  <label for="typesafeKey">TypeSafe (Jev) key</label>
  <input type="password" id="typesafeKey" autocomplete="off">
  <label for="anthropicKey">Anthropic key (Haiku fallback)</label>
  <input type="password" id="anthropicKey" autocomplete="off">
  <label for="classifier">Classifier</label>
  <select id="classifier">
    <option value="jev">Jev (TypeSafe)</option>
    <option value="haiku">Claude Haiku</option>
  </select>
  <label for="threshold">Threshold (0–1)</label>
  <input type="number" id="threshold" min="0" max="1" step="0.05">

  <div class="row">
    <button id="save">Save</button>
    <button id="reset" class="secondary">Reset stats</button>
  </div>
  <div id="saved"></div>

  <div class="stats">
    <span>Words beeped</span><b id="beeped">0</b>
    <span>Chat words masked</span><b id="chatMasked">0</b>
    <span class="jev">Jev caught (word list missed)</span><b class="jev" id="jevAdded">0</b>
    <span class="jev">Jev cleared (false alarms)</span><b class="jev" id="jevCleared">0</b>
    <span>Chunks processed</span><b id="chunks">0</b>
    <span>Speech-to-text failures</span><b id="sttFail">0</b>
    <span>Classifier late/failed</span><b id="classifierLate">0</b>
  </div>
  <div id="lastError"></div>
  <script src="popup.js"></script>
</body>
</html>
